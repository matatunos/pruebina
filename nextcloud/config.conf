################################################################################
# Nextcloud Audit Log Importer Configuration
################################################################################

# Nextcloud audit log location
NC_AUDIT_LOG="/var/www/nextcloud/data/audit.log"

# State file (tracks last processed position)
STATE_FILE="/var/lib/nextcloud-audit-importer/last_position"

# Database configuration
DB_NAME="nextcloud_logs"
DB_USER="nextcloud_audit"
MYSQL_CONFIG="/etc/nextcloud-audit-importer/.my.cnf"

# Processing configuration
BATCH_SIZE=100                    # Number of records to insert at once
PROCESS_INTERVAL=5                # Seconds between checks (polling mode)

# Logging configuration
IMPORTER_LOG="/var/log/nextcloud-audit-importer.log"
MAX_LOG_SIZE=10485760            # 10MB - rotate when log reaches this size

# Debug mode (set to 1 to enable verbose logging)
DEBUG=0
